<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
	<alias>
		<family>serif</family>
		<prefer>
			<family>Source Han Serif KR</family>
			<family>DejaVu Serif</family>
			<family>Droid Serif</family>
			<family>Joy Pixels</family>
			<family>Noto Color Emoji</family>
			<family>FontAwesome</family>
		</prefer>
	</alias>
	<alias>
		<family>sans-serif</family>
		<prefer>
			<family>Source Han Serif KR</family>
			<family>DejaVu Serif</family>
			<family>Droid Serif</family>
			<family>Joy Pixels</family>
			<family>Noto Color Emoji</family>
			<family>FontAwesome</family>
		</prefer>
	</alias>
	<alias>
		<family>sans</family>
		<prefer>
			<family>Source Han Sans KR</family>
			<family>DejaVu Sans</family>
			<family>Droid Sans</family>
			<family>Joy Pixels</family>
			<family>Noto Color Emoji</family>
			<family>FontAwesome</family>
		</prefer>
	</alias>
	<alias>
		<family>monospace</family>
		<prefer>
			<family>Noto Sans Mono</family>
      <family>Noto Sans Mono CJK KR</family>
      <family>Hack Nerd Font Mono</family>
      <family>FontAwesome</family>
			<family>Braille</family>
		</prefer>
	</alias>
  <alias>
    <family>nerdmono</family>
    <prefer>
      <family>D2CodingLigature Nerd Font Mono</family>
      <family>Hack Nerd Font Mono</family>
      <family>FontAwesome</family>
      <family>Braille</family>
    </prefer>
  </alias>
  <alias>
    <family>ko</family>
    <prefer>
      <family>Noto Sans CJK KR</family>
      <family>D2CodingLigature Nerd Font</family>
      <family>FontAwesome</family>
      <family>Braille</family>
    </prefer>
  </alias>
  <!-- Noto Sans Mono has no glyphs for the diagonal arrows U+2196-U+2199, so
       they fall back to the CJK fonts, whose versions are full-width. A
       terminal sizes each cell from wcwidth(), which reports 1 for these, so
       the glyph spills over the cell to its right and shears any aligned
       output that uses them - wttr.in's wind direction column, for one.
       Dropping the range from the CJK fonts hands the arrows to Hack Nerd Font
       Mono, which draws them single-width. -->
  <match target="scan">
    <test name="family" compare="contains">
      <string>Noto Sans CJK</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x2196</int><int>0x2199</int></range>
        </charset>
      </minus>
    </edit>
  </match>
  <match target="scan">
    <test name="family" compare="contains">
      <string>Noto Sans Mono CJK</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x2196</int><int>0x2199</int></range>
        </charset>
      </minus>
    </edit>
  </match>

  <match target="scan">
    <test name="family" compare="contains">
      <string>YetHangul</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0xe000</int><int>0xf8ff</int></range>
        </charset>
      </minus>
    </edit>
  </match>
  <match target="scan">
    <test name="family" compare="contains">
      <string>Adwaita</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0xe000</int><int>0xf8ff</int></range>
          <range><int>0x2300</int><int>0x23ff</int></range>
          <range><int>0x2600</int><int>0x27bf</int></range>
          <range><int>0x1f000</int><int>0x1faff</int></range>
        </charset>
      </minus>
    </edit>
  </match>
</fontconfig>
