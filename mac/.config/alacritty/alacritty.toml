[general]
import = ["~/.config/alacritty/themes/gruvbox_dark.toml"]

[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/bin/zsh"
args = ["-l"]

[window]
padding = { x = 1, y = 1 }
dynamic_padding = true
opacity = 0.8
decorations = "Buttonless"
dynamic_title = true
# Required for the Alt bindings below; mirrors kitty's macos_option_as_alt.
option_as_alt = "OnlyLeft"

[window.dimensions]
columns = 80
lines = 24

[font]
size = 12.0

[font.normal]
family = "FiraCode Nerd Font Mono"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font Mono"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font Mono"
style = "Italic"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 800
unfocused_hollow = true

[scrolling]
history = 10000
multiplier = 3

[selection]
semantic_escape_chars = " `'\"()[]{}"
save_to_clipboard = false

[keyboard]
bindings = [
  # Same keys as st (~/.local/src/suckless/st/config.def.h), with Command
  # standing in for st's Alt. kitty.conf and wezterm.lua carry the identical
  # set. (AeroSpace owns Option, exactly as dwm owns Super on Linux.)
  # Not available in alacritty: opacity (st Alt+a/s/=), copy last output (Alt+o).

  # clipboard                             st: Alt+c / Alt+v / Alt+Shift+v
  { key = "c", mods = "Command", action = "Copy" },
  { key = "v", mods = "Command", action = "Paste" },
  { key = "V", mods = "Command|Shift", action = "PasteSelection" },
  { key = "Insert", mods = "Shift", action = "PasteSelection" },
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },

  # font size                             st: Alt+Shift+k / j / +
  { key = "K", mods = "Command|Shift", action = "IncreaseFontSize" },
  { key = "J", mods = "Command|Shift", action = "DecreaseFontSize" },
  { key = "Plus", mods = "Command|Shift", action = "ResetFontSize" },

  # fullscreen, new terminal              st: Alt+f, F11, Alt+Shift+Return
  # (Simple: the native fullscreen Space cannot be managed by AeroSpace.)
  { key = "f", mods = "Command", action = "ToggleSimpleFullscreen" },
  { key = "F11", action = "ToggleSimpleFullscreen" },
  { key = "Return", mods = "Command|Shift", action = "CreateNewWindow" },

  # scrollback                            st: Alt+y/e line, Alt+u/d page
  { key = "y", mods = "Command", action = "ScrollLineUp" },
  { key = "e", mods = "Command", action = "ScrollLineDown" },
  { key = "u", mods = "Command", action = "ScrollPageUp" },
  { key = "d", mods = "Command", action = "ScrollPageDown" },
  { key = "PageUp", mods = "Command", action = "ScrollLineUp" },
  { key = "PageDown", mods = "Command", action = "ScrollLineDown" },
  { key = "PageUp", mods = "Command|Shift", action = "ScrollPageUp" },
  { key = "PageDown", mods = "Command|Shift", action = "ScrollPageDown" },

  # keyboard selection                    st: Ctrl+Shift+Escape
  { key = "Escape", mods = "Control|Shift", action = "ToggleViMode" },
  { key = "Space", mods = "Shift", action = "ToggleViMode" },
  { key = "F", mods = "Control|Shift", action = "SearchForward" },
  { key = "B", mods = "Control|Shift", action = "SearchBackward" },

  # Every other Command+key reaches the program as Alt+key, like st passes on
  # every Alt+key it has no shortcut for. tmux (M-h/j/k/l, M-g, M-t) and nvim
  # (<M-...>) rely on this.
  { key = "b", mods = "Command", chars = "\u001bb" },
  { key = "g", mods = "Command", chars = "\u001bg" },
  { key = "h", mods = "Command", chars = "\u001bh" },
  { key = "i", mods = "Command", chars = "\u001bi" },
  { key = "j", mods = "Command", chars = "\u001bj" },
  { key = "k", mods = "Command", chars = "\u001bk" },
  { key = "l", mods = "Command", chars = "\u001bl" },
  { key = "m", mods = "Command", chars = "\u001bm" },
  { key = "n", mods = "Command", chars = "\u001bn" },
  { key = "p", mods = "Command", chars = "\u001bp" },
  { key = "q", mods = "Command", chars = "\u001bq" },
  { key = "t", mods = "Command", chars = "\u001bt" },
  { key = "w", mods = "Command", chars = "\u001bw" },
  { key = "x", mods = "Command", chars = "\u001bx" },
  { key = "z", mods = "Command", chars = "\u001bz" },
  { key = "B", mods = "Command|Shift", chars = "\u001bB" },
  { key = "E", mods = "Command|Shift", chars = "\u001bE" },
  { key = "G", mods = "Command|Shift", chars = "\u001bG" },
  { key = "H", mods = "Command|Shift", chars = "\u001bH" },
  { key = "I", mods = "Command|Shift", chars = "\u001bI" },
  { key = "L", mods = "Command|Shift", chars = "\u001bL" },
  { key = "M", mods = "Command|Shift", chars = "\u001bM" },
  { key = "N", mods = "Command|Shift", chars = "\u001bN" },
  { key = "P", mods = "Command|Shift", chars = "\u001bP" },
  { key = "Q", mods = "Command|Shift", chars = "\u001bQ" },
  { key = "T", mods = "Command|Shift", chars = "\u001bT" },
  { key = "U", mods = "Command|Shift", chars = "\u001bU" },
  { key = "W", mods = "Command|Shift", chars = "\u001bW" },
  { key = "X", mods = "Command|Shift", chars = "\u001bX" },
  { key = "Y", mods = "Command|Shift", chars = "\u001bY" },
  { key = "Z", mods = "Command|Shift", chars = "\u001bZ" },
  { key = "0", mods = "Command", chars = "\u001b0" },
  { key = "1", mods = "Command", chars = "\u001b1" },
  { key = "2", mods = "Command", chars = "\u001b2" },
  { key = "3", mods = "Command", chars = "\u001b3" },
  { key = "4", mods = "Command", chars = "\u001b4" },
  { key = "5", mods = "Command", chars = "\u001b5" },
  { key = "6", mods = "Command", chars = "\u001b6" },
  { key = "7", mods = "Command", chars = "\u001b7" },
  { key = "8", mods = "Command", chars = "\u001b8" },
  { key = "9", mods = "Command", chars = "\u001b9" },
  { key = "/", mods = "Command", chars = "\u001b/" },
  { key = ".", mods = "Command", chars = "\u001b." },
  { key = ",", mods = "Command", chars = "\u001b," },
  { key = ";", mods = "Command", chars = "\u001b;" },
  { key = "\\", mods = "Command", chars = "\u001b\\" },
  { key = "<", mods = "Command|Shift", chars = "\u001b<" },
  { key = ">", mods = "Command|Shift", chars = "\u001b>" },
  { key = "'", mods = "Command", chars = "\u001b'" },
  { key = "-", mods = "Command", chars = "\u001b-" },
  { key = "`", mods = "Command", chars = "\u001b`" },
  { key = "Back", mods = "Command", chars = "\u001b\u007f" },
]

[hints]
[[hints.enabled]]
regex = '(https://|http://|file://|git://|ssh://|ftp://|mailto:)[^\s<>"]+'
hyperlinks = true
command = "open"
post_processing = true
mouse = { enabled = true, mods = "Control" }
# st: Alt+Ctrl+o (open a URL from the screen)
binding = { key = "o", mods = "Command|Control" }

# st: Alt+r (copy a URL from the screen)
[[hints.enabled]]
regex = '(https://|http://|file://|git://|ssh://|ftp://|mailto:)[^\s<>"]+'
hyperlinks = true
action = "Copy"
post_processing = true
binding = { key = "r", mods = "Command" }

# st: Alt+Shift+c (same, via the URL menu in st)
[[hints.enabled]]
regex = '(https://|http://|file://|git://|ssh://|ftp://|mailto:)[^\s<>"]+'
hyperlinks = true
action = "Copy"
post_processing = true
binding = { key = "C", mods = "Command|Shift" }
